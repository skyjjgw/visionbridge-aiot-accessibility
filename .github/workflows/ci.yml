name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard-and-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/api/requirements-dev.txt
      - run: pip install -r services/api/requirements-dev.txt
        working-directory: ${{ github.workspace }}
      - run: python -m pytest services/api/test_*.py
        working-directory: ${{ github.workspace }}

  edge-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: >-
          python -m py_compile
          edge/pi-runtime/detection_state.py
          edge/pi-runtime/visionbridge_edge_agent.py
          services/api/analysis.py
          services/api/app.py
          edge/pi-runtime/tools/resize_fixed_yolov8_onnx.py
          deploy/scripts/deploy_release.py
          deploy/scripts/deploy_media_stack.py
      - run: python -m unittest discover -s edge/tests -v

  volunteer-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/volunteer
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
